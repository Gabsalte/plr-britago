<title>PLR · Britago</title>
<style>
:root { --bg:#eef0f5; --card:#ffffff; --fg:#22232b; --mut:#6f7280; --borda:#e1e2e8; --pri:#0b66e4; --pri2:#7366ff; --erro:#c72438; color-scheme:light }
@media (prefers-color-scheme: dark) { :root { --bg:#15161d; --card:#22242d; --fg:#f4f5f8; --mut:#9aa3b2; --borda:rgba(255,255,255,.1); --pri:#0a84ff; --pri2:#9d94ff; --erro:#f26266; color-scheme:dark } }
* { box-sizing:border-box } html, body { margin:0; height:100% }
body { display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
  background-image:radial-gradient(900px 420px at 15% -10%, color-mix(in srgb, var(--pri) 14%, transparent), transparent 60%), radial-gradient(700px 380px at 100% 0%, color-mix(in srgb, var(--pri2) 14%, transparent), transparent 60%) }
form { width:min(380px, 100%); background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:26px 24px 22px; box-shadow:0 24px 60px -24px rgba(8,21,66,.35) }
.logo { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg, var(--pri), var(--pri2)); margin-bottom:14px }
h1 { margin:0; font-size:20px; letter-spacing:-.01em } p { margin:4px 0 18px; color:var(--mut); font-size:13px }
label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin-bottom:6px }
input[type=password] { width:100%; height:42px; border-radius:8px; border:1px solid var(--borda); background:transparent; color:inherit; padding:0 12px; font-size:15px }
input[type=password]:focus { outline:0; border-color:var(--pri); box-shadow:0 0 0 3px color-mix(in srgb, var(--pri) 20%, transparent) }
.lembrar { display:flex; align-items:center; gap:8px; margin:12px 0 16px; font-size:12.5px; color:var(--mut); text-transform:none; letter-spacing:0 }
button { width:100%; height:42px; border:0; border-radius:8px; color:#fff; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(180deg, color-mix(in srgb, var(--pri) 85%, #fff), var(--pri)) }
button:disabled { opacity:.7; cursor:wait }
.erro { min-height:18px; margin-top:10px; font-size:12.5px; color:var(--erro) }
</style></head>

const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(D.sal), iterations: D.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(D.iv) }, chave, bin(D.c)));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
f.addEventListener('submit', async ev => {
  ev.preventDefault(); const senha = document.getElementById('s').value; e.textContent = ''; b.disabled = true; b.textContent = 'Abrindo…';
  try { await abrir(senha); try { if (document.getElementById('l') && document.getElementById('l').checked) localStorage.setItem('plr-senha', senha); } catch (x) {} }
  catch (x) { b.disabled = false; b.textContent = 'Entrar'; e.textContent = 'Senha incorreta. Confira e tente de novo.'; }
});
document.getElementById('l').addEventListener('change', ev => { if (!ev.target.checked) try { localStorage.removeItem('plr-senha'); } catch (x) {} });
try { const s = localStorage.getItem('plr-senha'); if (s) abrir(s).catch(() => { try { localStorage.removeItem('plr-senha'); } catch (x) {} }); } catch (x) {}
